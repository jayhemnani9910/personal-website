name: CI

# Why this exists: on 17 Aug 2026 a commit reached main carrying a failing test
# (youtube.test.ts pinned a channel handle the committed data no longer used),
# and that failing test was pointing at a live crash on /youtube. Nothing caught
# it, because nothing ran. Vercel builds on push, but a Vercel build does not run
# vitest, so a red suite deploys just as happily as a green one.
#
# Several guards in this repo only pay off if something runs them:
#   tokens.test.ts      WCAG contrast against the real globals.css, no hardcoded
#                       line heights, no source dir hidden from Tailwind by .gitignore
#   webmcp.test.ts      tool-name array matches the real registerTool calls
#   showcase.test.ts    every architecture image and compare frame resolves
#   fde-prompt.test.ts  system prompt and visitor brief stay in separate channels
#   adr.test.ts         the decision records stay well-formed and indexed
#   perf budget         script, CSS, document and fetch bytes, font-file count
#                       and LCP for the home route (ADR 0008)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: this workflow only checks things.
permissions:
  contents: read

# Cancel superseded runs on pull requests only. On main every push deploys, so
# every commit keeps its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: fails if package-lock.json and package.json disagree.
      - name: Install
        run: npm ci

      # Production dependencies only: a dev-only advisory cannot reach visitors.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # next build type-checks too, but running tsc separately reports a type
      # error as a type error rather than as a build failure a minute later.
      # `next typegen` first, so typed routes (typedRoutes) are checked too.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Last, because it is slowest. Empty placeholders keep the build honest
      # without exposing anything: the API routes read these at request time,
      # not at build time.
      - name: Build
        run: npm run build
        env:
          UPSTASH_REDIS_REST_URL: ""
          UPSTASH_REDIS_REST_TOKEN: ""
          GEMINI_API_KEY: ""

      # Browser only, no system deps: the runner already has what Chromium needs
      # and --with-deps costs an apt update for nothing here.
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install chromium

      # Serves the build just made and measures it. The byte counts are exact
      # and machine-independent, which is why they can gate a merge; the LCP
      # assertion skips itself under CI, because on a shared runner it measures
      # the runner. The visual suite deliberately does NOT run here, see
      # playwright.config.ts.
      - name: Performance budget
        run: npm run test:perf:ci
        env:
          UPSTASH_REDIS_REST_URL: ""
          UPSTASH_REDIS_REST_TOKEN: ""
          GEMINI_API_KEY: ""

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
